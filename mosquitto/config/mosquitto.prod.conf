# Production Mosquitto Configuration
# Enforces TLS Encryption, Password Authentication, and Strict Access Control

# Plaintext listener (restricted or disabled; comment out if enforcing 100% TLS)
# listener 1883 127.0.0.1

# Production TLS Listener (port 8883)
listener 8883
protocol mqtt

# TLS Certificates
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
tls_version tlsv1.3

# Authentication & Authorization
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Persistence & Storage
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
connection_messages true
log_timestamp true
log_type error
log_type warning
log_type notice
log_type information
