version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: edge-mqtt-broker-prod
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-prod-data:/mosquitto/data
      - mosquitto-prod-log:/mosquitto/log

  edge-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge-ai-detector-prod
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      - mqtt-broker
    devices:
      # Pass through V4L2 USB / CSI Camera device node if present
      - "/dev/video0:/dev/video0"

volumes:
  mosquitto-prod-data:
  mosquitto-prod-log:
