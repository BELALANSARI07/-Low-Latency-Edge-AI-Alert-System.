[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-edge-ai-alert-system"
version = "1.0.0"
description = "Edge-Deployed Computer Vision System for High-Speed Object Detection & Local Real-Time Alert Triggering"
readme = "README.md"
authors = [
    { name = "Belal Ansari", email = "belalansari000078@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.9.0.80",
    "onnxruntime>=1.17.0",
    "paho-mqtt>=2.0.0",
    "psutil>=5.9.8",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "torch>=2.2.0",
    "ultralytics>=8.1.0",
    "onnx>=1.15.0",
]
gpu = [
    "onnxruntime-gpu>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
